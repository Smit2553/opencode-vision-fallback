name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Disposable V2 runtime with loopback fixture
        shell: bash
        run: |
          mkdir -p /tmp/opencode
          sdk_dir=$(mktemp -d "${RUNNER_TEMP}/vision-fallback-sdk-XXXXXX")
          npm install --prefix "$sdk_dir" --ignore-scripts --no-audit @opencode/sdk@2.0.24
          tarball=$(npm pack --ignore-scripts --pack-destination "$sdk_dir")
          npm install --prefix "$sdk_dir" --ignore-scripts --no-audit "$sdk_dir/$tarball"
          node scripts/runtime-smoke.mjs "$sdk_dir" "$sdk_dir/node_modules/opencode-vision-fallback"
